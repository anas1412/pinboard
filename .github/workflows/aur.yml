name: AUR

# When a release is published here, update the tackora-bin AUR package to that version.
# Runs on publish, not on the draft, so the .deb it downloads already exists.
# Needs the AUR_SSH_PRIVATE_KEY secret: a key registered on the AUR account that maintains tackora-bin.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, like 0.3.1"
        required: true

jobs:
  aur:
    runs-on: ubuntu-latest
    steps:
      - name: Version
        id: v
        run: |
          v="${{ github.event.release.tag_name || inputs.version }}"
          echo "version=${v#v}" >> "$GITHUB_OUTPUT"

      - name: Current package from the AUR
        run: |
          git clone https://aur.archlinux.org/tackora-bin.git aur
          sed -i "s/^pkgver=.*/pkgver=${{ steps.v.outputs.version }}/; s/^pkgrel=.*/pkgrel=1/" aur/PKGBUILD

      - uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: tackora-bin
          pkgbuild: aur/PKGBUILD
          updpkgsums: true
          test: true
          commit_username: anas1412
          commit_email: anasbassoumi@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "tackora-bin ${{ steps.v.outputs.version }}-1"
